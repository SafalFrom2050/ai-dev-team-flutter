<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Runtime-neutral sub-agent harness architecture</title>
  <desc id="desc">A dark diagram showing Codex, Claude Code, and Antigravity as equal native sub-agent runtimes, with Gemini, Cursor, and packet fallback using the same role contracts and repo handoffs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f8fafc"/>
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-lime" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a3e635"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#737373"/>
    </marker>
    <style>
      .title { font-family: Arial, Helvetica, sans-serif; font-size: 38px; font-weight: 800; fill: #ffffff; }
      .subtitle { font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 500; fill: #a3a3a3; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 800; fill: #ffffff; }
      .mid { font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 800; fill: #ffffff; }
      .body { font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 500; fill: #d4d4d4; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 800; fill: #a3a3a3; letter-spacing: 1px; }
      .tiny { font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: 700; fill: #d4d4d4; }
      .mono { font-family: Consolas, monospace; font-size: 13px; font-weight: 700; fill: #ffffff; }
      .shell { fill: #050505; stroke: #262626; stroke-width: 2; }
      .lane { fill: #0a0a0a; stroke: #262626; stroke-width: 1.5; }
      .card { fill: #111111; stroke: #3f3f46; stroke-width: 1.5; }
      .flow { stroke: #f8fafc; stroke-width: 2.5; marker-end: url(#arrow); }
      .flow-cyan { stroke: #22d3ee; stroke-width: 2.5; marker-end: url(#arrow-cyan); }
      .flow-lime { stroke: #a3e635; stroke-width: 2.5; marker-end: url(#arrow-lime); }
      .flow-muted { stroke: #737373; stroke-width: 2; stroke-dasharray: 8 8; marker-end: url(#arrow-muted); }
    </style>
  </defs>

  <rect width="1200" height="760" rx="28" fill="#050505"/>
  <rect x="30" y="30" width="1140" height="700" rx="24" class="shell"/>

  <text x="72" y="84" class="title">Runtime-Neutral Sub-Agent Harness</text>
  <text x="72" y="118" class="subtitle">The repo owns the role contracts. Supported tools run the same specialists; packets remain the portable fallback.</text>

  <g transform="translate(72 154)">
    <rect x="0" y="0" width="1056" height="150" rx="18" class="lane"/>
    <text x="28" y="36" class="small">SUPPORTED RUNTIME SURFACE</text>
    <text x="28" y="70" class="body">No single tool is treated as the default winner. Choose the available runtime, keep one specialist per role, and preserve repo handoffs.</text>

    <rect x="28" y="92" width="170" height="42" rx="12" fill="#06161f" stroke="#22d3ee" stroke-width="2"/>
    <text x="113" y="119" text-anchor="middle" class="mid">Codex</text>

    <rect x="218" y="92" width="170" height="42" rx="12" fill="#10131f" stroke="#818cf8" stroke-width="2"/>
    <text x="303" y="119" text-anchor="middle" class="mid">Claude Code</text>

    <rect x="408" y="92" width="170" height="42" rx="12" fill="#181203" stroke="#f59e0b" stroke-width="2"/>
    <text x="493" y="119" text-anchor="middle" class="mid">Antigravity</text>

    <rect x="598" y="92" width="170" height="42" rx="12" class="card"/>
    <text x="683" y="119" text-anchor="middle" class="mid">Gemini CLI</text>

    <rect x="788" y="92" width="112" height="42" rx="12" class="card"/>
    <text x="844" y="119" text-anchor="middle" class="mid">Cursor</text>

    <rect x="920" y="92" width="108" height="42" rx="12" class="card"/>
    <text x="974" y="119" text-anchor="middle" class="mid">Future</text>
  </g>

  <g transform="translate(72 340)">
    <rect x="0" y="0" width="1056" height="214" rx="18" class="lane"/>

    <rect x="32" y="54" width="224" height="102" rx="16" fill="#151015" stroke="#f472b6" stroke-width="2"/>
    <text x="144" y="91" text-anchor="middle" class="label">Main Chat</text>
    <text x="144" y="119" text-anchor="middle" class="body">CEO or Office Assistant</text>
    <text x="144" y="141" text-anchor="middle" class="body">orchestrate and monitor</text>

    <line x1="256" y1="105" x2="382" y2="105" class="flow-cyan"/>

    <rect x="402" y="40" width="252" height="130" rx="16" fill="#07171a" stroke="#22d3ee" stroke-width="2"/>
    <text x="528" y="76" text-anchor="middle" class="label">Role Contract</text>
    <text x="528" y="105" text-anchor="middle" class="body">activation banner</text>
    <text x="528" y="128" text-anchor="middle" class="body">mission, branch, ownership</text>
    <text x="528" y="151" text-anchor="middle" class="body">handoff or outbox path</text>

    <line x1="654" y1="105" x2="780" y2="105" class="flow-lime"/>

    <rect x="800" y="54" width="224" height="102" rx="16" fill="#111406" stroke="#a3e635" stroke-width="2"/>
    <text x="912" y="91" text-anchor="middle" class="label">Native Workers</text>
    <text x="912" y="119" text-anchor="middle" class="body">spawn when policy allows</text>
    <text x="912" y="141" text-anchor="middle" class="body">otherwise paste packets</text>
  </g>

  <g transform="translate(72 590)">
    <rect x="0" y="0" width="1056" height="100" rx="18" class="lane"/>
    <text x="28" y="32" class="small">SPECIALIST ROLES STAY SEPARATE</text>

    <rect x="28" y="48" width="132" height="34" rx="10" class="card"/>
    <text x="94" y="70" text-anchor="middle" class="tiny">Product</text>

    <rect x="188" y="48" width="132" height="34" rx="10" class="card"/>
    <text x="254" y="70" text-anchor="middle" class="tiny">Design</text>

    <rect x="348" y="48" width="132" height="34" rx="10" class="card"/>
    <text x="414" y="70" text-anchor="middle" class="tiny">Architecture</text>

    <rect x="508" y="48" width="132" height="34" rx="10" class="card"/>
    <text x="574" y="70" text-anchor="middle" class="tiny">Flutter Devs</text>

    <rect x="668" y="48" width="132" height="34" rx="10" class="card"/>
    <text x="734" y="70" text-anchor="middle" class="tiny">QA</text>

    <rect x="828" y="48" width="132" height="34" rx="10" class="card"/>
    <text x="894" y="70" text-anchor="middle" class="tiny">Review</text>

    <rect x="984" y="48" width="44" height="34" rx="10" fill="#1c1917" stroke="#f59e0b" stroke-width="2"/>
    <text x="1006" y="70" text-anchor="middle" class="tiny">main</text>

    <line x1="160" y1="65" x2="188" y2="65" class="flow"/>
    <line x1="320" y1="65" x2="348" y2="65" class="flow"/>
    <line x1="480" y1="65" x2="508" y2="65" class="flow"/>
    <line x1="640" y1="65" x2="668" y2="65" class="flow"/>
    <line x1="800" y1="65" x2="828" y2="65" class="flow"/>
    <line x1="960" y1="65" x2="984" y2="65" class="flow"/>
  </g>

  <path d="M984 304 C984 320 984 322 984 340" class="flow-muted"/>
  <path d="M984 554 C984 572 1006 572 1006 590" class="flow-muted"/>

  <g transform="translate(72 710)">
    <rect x="0" y="-28" width="1056" height="32" rx="11" fill="#111111" stroke="#262626"/>
    <text x="528" y="-7" text-anchor="middle" class="body">Source of truth: Markdown contracts, docs, branches, commits, PRs, status index, handoffs, and outboxes.</text>
  </g>
</svg>
