name: Quality Gates

on:
  pull_request:
    branches:
      - main
    paths:
      - 'work/**'

jobs:
  analyze_and_test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: work/minimal-timer-app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.x'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build web
        run: flutter build web
